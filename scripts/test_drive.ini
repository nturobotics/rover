[env:esp32cam]
platform = espressif32@6.9.0        ; Arduino-ESP32 core 2.0.17 (stable)
board = esp32cam                    ; AI-Thinker ESP32-CAM
framework = arduino

; ---- Serial ----
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0

; ---- Flash / partitions ----
; OTA needs two app slots. min_spiffs gives ~1.9 MB per slot, which leaves
; comfortable room for camera + WiFi + OTA code.
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = dio

; ---- Build flags ----
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

